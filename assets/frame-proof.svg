    <g id="slip"><path d="M0 0h62l7 10-7 10H0z" fill="#f7efdc" stroke="#7a8176"/><circle cx="58" cy="10" r="2.2" fill="#c6c4af"/><path d="M21 7h25m-25 6h18" stroke="#9aa292"/></g>
  </defs>
  <path fill="#e8ddc3" d="M0 0h310v220H0z"/><path fill="url(#grain)" d="M9 9h292v202H9z"/><rect x="8.5" y="8.5" width="293" height="203" fill="none" stroke="#a09579"/>
  <g transform="translate(39 48) scale(.5)">
    <path d="M-7-7h270v270H-7z" fill="#f6edd8" stroke="#778b80" stroke-width="2"/><path d="M0 0h256v256H0z" fill="#294b60"/><path d="M0 0h256v256H0z" fill="url(#grid)"/>
    <g fill="none" stroke-width="4"><rect x="85" y="64" width="85" height="64" stroke="#ffcf97"/><rect x="99" y="143" width="51" height="42" stroke="#9cd7c8"/></g>
    <path d="M10 30V10h20m196 0h20v20m0 196v20h-20m-196 0H10v-20" fill="none" stroke="#c4d2c4" stroke-width="2"/>
  </g>
