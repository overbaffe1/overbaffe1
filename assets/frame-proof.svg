<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 220" width="310" height="220" role="img" aria-labelledby="title desc">
  <title id="title">05 · Один кадр, четыре записи</title>
  <desc id="desc">Координатная сетка 256 на 256 с двумя рамками из первой аннотации. Справа четыре бумажных ярлыка для четырёх вопросов к кадру. Это схема, а не фотография.</desc>
  <defs>
