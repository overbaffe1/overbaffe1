    <pattern id="holes" width="9" height="5" patternUnits="userSpaceOnUse"><rect x="1" y="1" width="4.4" height="3.1" rx=".7" fill="#76948a"/></pattern>
    <g id="strip"><path d="m0 0 8 1 5-2 186 1-2 7 3 4-3 5 2 8-3 4H0l2-8-3-6 2-6z" fill="#efe5c7" stroke="#4b6b61" stroke-width="1.2"/><path d="M5 4h188v4H5zm0 17h188v4H5z" fill="url(#holes)"/></g>
  </defs>
  <path fill="#aec3b5" d="M0 0h310v220H0z"/><path fill="url(#paper)" d="M9 9h292v202H9z"/><rect x="8.5" y="8.5" width="293" height="203" fill="none" stroke="#768f82"/>
  <use href="#strip" x="82" y="61"/><use href="#strip" x="82" y="130"/>
  <path d="M97 47v126" stroke="#537466" fill="none" stroke-dasharray="2 3"/>
  <g fill="#315650"><circle cx="97" cy="76" r="4.3"/><circle cx="145" cy="76" r="4.3"/><circle cx="193" cy="76" r="4.3"/><circle cx="241" cy="76" r="4.3"/></g>
  <g fill="#a85037"><circle cx="97" cy="145" r="4.3"/><circle cx="133.92" cy="145" r="4.3"/><circle cx="170.85" cy="145" r="4.3"/><circle cx="207.77" cy="145" r="4.3"/></g>
  <g stroke-width="1.1" fill="none"><path d="M97 94v6h48v-6" stroke="#406357"/><path d="M97 163v6h36.92v-6" stroke="#995339"/></g>
  <g font-family="Consolas,'DejaVu Sans Mono',monospace" fill="#294c41"><text x="27" y="81" font-size="14">1,0×</text><text x="27" y="150" font-size="14" fill="#803f2e">1,3×</text><text x="157" y="106" font-size="12">33,3 мс</text><text x="146" y="175" font-size="12" fill="#803f2e">25,6 мс</text><text x="19" y="32" font-size="16">06</text><text x="290" y="202" text-anchor="end" font-size="13">TICK</text></g>
