<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 220" width="310" height="220" role="img" aria-labelledby="title desc">
  <title id="title">06 · Темп одного плана</title>
  <desc id="desc">У двух перфолент общее начало. Расстояние между соседними метками составляет 48 условных единиц при скорости 1 и примерно 36,92 при скорости 1,3.</desc>
  <defs>
