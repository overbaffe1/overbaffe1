<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 220" width="310" height="220" role="img" aria-labelledby="title desc">
  <title id="title">04 · Петля ожидания</title>
  <desc id="desc">Две станции связаны встречными стрелками. На четвёртом ходу A ждёт B, на седьмом B ждёт A. Учебная схема правила deadlock.</desc>
