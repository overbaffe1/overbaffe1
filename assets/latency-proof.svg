  <title id="title">08 · Время одного безусловного прохода</title>
  <desc id="desc">Две полосы от общего нуля: 2,993 секунды для эталона и 0,297 секунды для одного токена. Длина полос пропорциональна времени, а не числу токенов.</desc>
