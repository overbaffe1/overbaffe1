<svg xmlns="http://www.w3.org/2000/svg" width="640" height="60" viewBox="0 0 640 60" role="img" aria-labelledby="title desc">
  <title id="title">КосмоХакатон 2026 · орбитальная виньетка</title>
  <desc id="desc">На карте звёздного неба тонкая орбита огибает гравированную Луну. Светлая дуга проходит перед диском, пунктир — за ним.</desc>
