<svg xmlns="http://www.w3.org/2000/svg" width="640" height="60" viewBox="0 0 640 60" role="img" aria-labelledby="title desc">
  <title id="title">AI Journey Contest 2026 · маршрутная виньетка</title>
  <desc id="desc">Шесть медных станций соединены бирюзовыми линиями. На стыке лент — двухцветная стрелка компаса.</desc>
  <defs>
    <linearGradient id="enamel" x2="0" y2="1">
      <stop stop-color="#254e51"/><stop offset=".55" stop-color="#163c44"/><stop offset="1" stop-color="#294f50"/>
    </linearGradient>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="m-1 1 2-2M0 6l6-6m-1 7 2-2" stroke="#bdd1b1" stroke-width=".65" opacity=".26"/>
    </pattern>
    <path id="tape" d="M3 30 15 17h257l12-5h72l12 5h257l12 13-12 13H368l-12 5h-72l-12-5H15Z"/>
    <clipPath id="cut"><use href="#tape"/></clipPath>
    <g id="rails" fill="none" stroke-linejoin="round">
      <path d="M12 30h30l22-9h58l22 11h36l23-11h46l36 10h21" stroke="#ccd6b3" stroke-width="1.45"/>
      <path d="M12 33h31l22-9h56l22 11h38l23-11h44l36 10h23" stroke="#7eb4a2" stroke-width="1.1"/>
      <path d="M12 36h32l22-9h54l22 11h40l23-11h42l36 10h24" stroke="#d49e77" stroke-width="1.15"/>
      <path d="M26 20h21m103 1h28m42 17h33m19-20 13-4h14" stroke="#c8b993" stroke-dasharray="1 3"/>
    </g>
    <g id="stop" fill="#ecb182" stroke="#183e44" stroke-width="1.1"><circle r="3.4"/><circle r="1.2" fill="#305959" stroke="none"/></g>
    <path id="tick" d="M0-22v2" stroke="#e0c29a" stroke-width="1.2"/>
  </defs>
  <use href="#tape" fill="url(#enamel)" stroke="#a99473" stroke-width="1.3"/>
  <g clip-path="url(#cut)">
    <use href="#tape" fill="url(#hatch)"/>
    <path d="M12 19h260l12-5h72l12 5h260M12 41h260l12 5h72l12-5h260" stroke="#beb396" stroke-width=".7" fill="none"/>
    <use href="#rails"/><use href="#rails" transform="translate(640 0) scale(-1 1)"/>
    <use href="#stop" x="44" y="32.5"/><use href="#stop" x="151" y="35"/><use href="#stop" x="236" y="24"/>
    <use href="#stop" x="404" y="24"/><use href="#stop" x="489" y="35"/><use href="#stop" x="596" y="32.5"/>
  </g>
  <g transform="translate(320 30)">
    <path d="m0-29 20 8 9 21-9 21-20 8-20-8-9-21 9-21Z" fill="#ebd7ae" stroke="#9b876d"/>
    <circle r="24.4" fill="#22484d" stroke="#756e5c"/><circle r="17.5" fill="none" stroke="#97b2a1" stroke-width=".75"/>
    <use href="#tick"/><use href="#tick" transform="rotate(45)"/><use href="#tick" transform="rotate(90)"/><use href="#tick" transform="rotate(135)"/>
    <use href="#tick" transform="rotate(180)"/><use href="#tick" transform="rotate(225)"/><use href="#tick" transform="rotate(270)"/><use href="#tick" transform="rotate(315)"/>
    <path d="M-15 0h30M0-15v30" stroke="#839e93" stroke-width=".75"/>
    <g transform="rotate(38)" stroke-linejoin="round">
      <path d="M0-22 6 2 0 21-6-2Z" fill="#b9694e" stroke="#142f37"/>
      <path d="m0-22 6 24-6-3Z" fill="#f4c7a0"/><path d="m0 21-6-23 6 3Z" fill="#d6e2c8"/>
      <circle r="2.6" fill="#e1cda4" stroke="#28484a"/>
    </g>
  </g>
